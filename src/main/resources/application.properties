spring.application.name=aroma-origem

spring.config.import=optional:file:src/main/resources/secrets.properties

#PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/aroma_origem
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=org.postgresql.Driver

#Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.delivery.timeout.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000